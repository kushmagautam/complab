<html>
<head>
    <title>Embedding Page</title>
</head>
<body>
    <h1 style="background-color: rgb(147, 121, 209);">Embedding Page</h1>
    <p><b>PDF Document:</b></p>
    <object data="document.pdf" type="application/pdf" width="150" height="150">
        <p>Your browser cannot display this PDF. <a href="document.pdf">Download PDF</a>.</p>
    </object>

    <p><b>Graphics/Media:</b></p>
    <embed src="graphic.svg" type="image/svg+xml" width="200" height="150">

    <p><b>External Webpage:</b></p>
    <iframe src="about.html" width="150" height="150" title="Example Webpage"></iframe>
      <p><a href="index.html">Back Home</a></p>
</body>
</html>
