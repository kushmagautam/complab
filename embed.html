<html>
<head>
    <title>Embedding Page</title>
</head>
<body>
    <h1 style="background-color: rgb(147, 121, 209);">Embedding Page</h1>

    <p>PDF Document:</p>
    <object data="document.pdf" type="application/pdf" width="200" height="200">
        <p>Your browser cannot display this PDF. <a href="document.pdf">Download PDF</a>.</p>
    </object>

    <p>Graphics/Media:</p>
    <embed src="graphic.svg" type="image/svg+xml" width="300" height="200">

    <p>External Webpage:</p>
    <iframe src="about.html" width="500" height="300" title="Example Webpage"></iframe>
      <p><a href="index.html">Back Home</a></p>
</body>
</html>
